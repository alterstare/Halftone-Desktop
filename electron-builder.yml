appId: com.noth2.mangamanager
productName: Halftone
publish:
  provider: github
  owner: alterstare
  repo: Halftone-Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # better-sqlite3 ships its C sources (~10MB); only the built .node is needed.
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'
# better-sqlite3 (캐릭터 분류 / Sorta) is already the Electron-ABI prebuilt
# (scripts/native.mjs on install): don't let electron-builder compile it.
npmRebuild: false
# Native addons + their DLLs / shared libs must live outside the asar:
# local OCR runtime, and Sorta's SQLite + image library.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
win:
  # Multi-size icon pre-rendered by scripts/make-ico.cjs (crisp taskbar/desktop sizes).
  icon: build/icon.ico
  target:
    - nsis
    - zip
  # Ship only this platform's onnxruntime binaries. A platform `files` list with
  # only exclusions makes electron-builder fall back to "**/*" (the whole project
  # dir — old dist/ installers, src, docs went into app.asar: 118MB → 490MB
  # setup), so repeat the includes here.
  files:
    - out/**/*
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces: on-disk name == latest.yml url == uploaded asset name, so the
  # updater can find the installer (GitHub/electron-updater don't reconcile spaces).
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target:
    - AppImage
    - tar.gz
  files:
    - out/**/*
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v*/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v*/linux/arm64/**'
  category: Graphics

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 캐릭터 분류 mode: Sorta's screen (src/sorta, synced from ../sorta) in a
         frame of the main window; its own styles stay inside this frame. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' sorta-img: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Sorta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/sorta-main.ts"></script>
  </body>
</html>
